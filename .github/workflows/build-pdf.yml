name: Build PDF

on:
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [created, published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install LaTeX and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full biber latexmk default-jre-headless

    - name: Build PDF
      run: |
        latexmk -pdf -interaction=nonstopmode TFM_Victor_Pariente_Gonzalez.tex

    - name: Upload PDF as Release Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      with:
        files: build/TFM_Victor_Pariente_Gonzalez.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TFM-PDF
        path: build/TFM_Victor_Pariente_Gonzalez.pdf
        retention-days: 30

    - name: Publish PDF in the "latest" release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        gh release view latest >/dev/null 2>&1 || gh release create latest \
          --prerelease --target main --title "PDF más reciente" \
          --notes "PDF compilado automáticamente a partir de la última versión de main."
        gh release upload latest build/TFM_Victor_Pariente_Gonzalez.pdf --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
