name: Build PDF

on:
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [created, published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install LaTeX and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full biber latexmk

    - name: Build PDF
      run: |
        latexmk -pdf TFM_Victor_Pariente_Gonzalez.tex
      continue-on-error: true

    - name: Upload PDF as Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      with:
        files: build/TFM_Victor_Pariente_Gonzalez.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TFM-PDF
        path: build/TFM_Victor_Pariente_Gonzalez.pdf
        retention-days: 30
